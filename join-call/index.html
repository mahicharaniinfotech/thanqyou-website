<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joining your ThanQYou call…</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: #722F37;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 360px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #555; font-size: 14px; line-height: 1.5; }
  a.button {
    display: inline-block;
    margin-top: 16px;
    background: #722F37;
    color: white;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 24px;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Opening ThanQYou…</h1>
    <p>If nothing happens, make sure ThanQYou is installed, then tap the button below.</p>
    <a id="openLink" class="button" href="#">Open ThanQYou</a>
  </div>

<script>
  // This page's only job: take whatever query string this URL was
  // opened with (conversationId, callType, social, socialUid - exactly
  // what the app already generates - see chat_screen.dart/
  // social_dm_chat.dart's _sendCallLink()) and hand off to the SAME
  // thanqyou:// deep link, unchanged. The reason this page needs to
  // exist at all: WhatsApp (and virtually every messaging app) only
  // auto-linkifies http:// and https:// URLs as tappable - a bare
  // thanqyou:// custom scheme in a shared message just renders as
  // plain, non-tappable text. Sharing THIS https:// URL instead means
  // WhatsApp correctly shows a real, tappable blue link, and opening
  // it immediately redirects to the real deep link, which works
  // exactly as before for anyone who already has the app installed.
  //
  // NOTE: this does not yet handle the case where the app ISN'T
  // installed (no app store fallback, no smart App/Universal Links
  // domain verification) - that's a separate, larger infrastructure
  // task. For now, someone without the app just sees this page with a
  // manual "Open ThanQYou" button that will silently fail if the app
  // isn't installed - acceptable for launch, since call links are
  // shared between existing app users in practice.
  const params = window.location.search; // includes the leading '?'
  const deepLink = 'thanqyou://' + '/join-call' + params;
  document.getElementById('openLink').href = deepLink;
  window.location.href = deepLink;
</script>
</body>
</html>
