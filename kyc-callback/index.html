<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Complete — ThanqYou</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #000000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .check {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #722F37;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }
  .check svg {
    width: 36px;
    height: 36px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #000000;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: #333333;
    margin-bottom: 8px;
  }
  .brand {
    margin-top: 32px;
    font-size: 13px;
    color: #999999;
    letter-spacing: 0.5px;
  }
  .brand span {
    color: #722F37;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17L4 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Verification Complete</h1>
    <p>You can close this tab now and return to the ThanqYou app.</p>
    <p>Your KYC status will update automatically within a few seconds.</p>
    <div class="brand">Thanq<span>You</span></div>
  </div>
</body>
</html>
